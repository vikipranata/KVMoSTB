# A v* tag pushes a release: the arm64 .deb is built from the tagged commit
# and published as a GitHub release with its sha256 checksum. Release notes
# are the "## [version]" section of CHANGELOG.md (pattern: vaultite/vaultite's
# release.yml).
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build without the leading v (for example 1.0.1)"
        required: true
concurrency:
  group: release-${{ github.ref }}
permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-~+.][0-9A-Za-z.]+)?$'; then
            echo "::error::'$version' is not a valid Debian version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install the arm64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross linux-libc-dev-arm64-cross

      - name: Test
        run: go test ./...
        env:
          GOPROXY: "off"
          GOFLAGS: "-mod=mod"

      - name: Build the package
        run: ./packaging/build-deb.sh
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Check the package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          deb="dist/kvmostb_${VERSION}_arm64.deb"
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb"
          dpkg-deb -x "$deb" /tmp/pkg
          file /tmp/pkg/usr/bin/kvmostb | grep -q 'ARM aarch64'
          (cd dist && sha256sum "$(basename "$deb")" > "$(basename "$deb").sha256")

      # The notes are the "## [version]" section of CHANGELOG.md, with a link
      # to the full changelog appended (vaultite's pattern).
      - name: Release notes
        if: github.event_name == 'push'
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          awk -v h="## [$V]" 'index($0, h) == 1 { on = 1; next } on && /^##/ { exit } on' CHANGELOG.md > notes.md
          printf '\nEvery change: [CHANGELOG.md](%s/blob/%s/CHANGELOG.md).\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> notes.md

      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.version }}
        run: |
          # Idempotent: a re-run, or a release left behind by an earlier
          # workflow version, edits the existing release and re-uploads the
          # assets instead of failing on 'release already exists'.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "KVMoSTB $V" --notes-file notes.md
            gh release upload --clobber "$GITHUB_REF_NAME" dist/*.deb dist/*.sha256
          else
            gh release create "$GITHUB_REF_NAME" dist/*.deb dist/*.sha256 \
              --title "KVMoSTB $V" --notes-file notes.md
          fi

      - name: Keep the package as a build artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: kvmostb-deb
          if-no-files-found: error
          path: dist/*
